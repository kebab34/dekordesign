<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Catalogue Carrelages — Dekor &amp; Design 2025</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Montserrat:ital,wght@0,100;0,200;0,300;0,400;0,700;0,900;1,100;1,300&display=swap" rel="stylesheet">
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
body{background:#1a1a1a;font-family:'Montserrat',sans-serif;-webkit-print-color-adjust:exact;print-color-adjust:exact;}

/* ══ TOUTES LES PAGES : 1600 × 960 px ══ */
.pg-p, .pg-l{
  width:1600px; height:960px;
  position:relative; overflow:hidden;
  display:block; margin:0 auto 4px;
}

/* ════════════════════════
   COUVERTURE (paysage)
   [TEXTE gauche] [RENDER droite]
════════════════════════ */
.cover{display:flex;flex-direction:row;background:#0c0c0c;}

/* Panneau gauche titre */
.cover-left{
  flex:0 0 40%;height:100%;
  background:#0c0c0c;
  display:flex;flex-direction:column;
  padding:52px 50px 44px 56px;
  position:relative;z-index:1;
}
/* cover-left::after fade supprimé */
.cover-bar{position:absolute;top:0;left:0;width:4px;height:100%;
  background:linear-gradient(to bottom,#63c23e,#3a9e1e,rgba(58,158,30,0));}

/* Render droite */
.cover-right{
  flex:1;height:100%;position:relative;overflow:hidden;
}
.cover-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
/* cover-right-fade supprimé */

/* Contenu panneau gauche */
.cover-logo{height:44px;width:auto;margin-bottom:auto;}
.cover-spacer{flex:1;}
.cover-eyebrow{font-size:11px;font-weight:700;letter-spacing:6px;color:#63c23e;text-transform:uppercase;margin-bottom:16px;}
.cover-title{font-size:72px;font-weight:900;color:#fff;text-transform:uppercase;letter-spacing:-1px;line-height:.93;margin-bottom:14px;}
.cover-title .light{font-weight:100;font-style:italic;color:rgba(255,255,255,.65);}
.cover-rule{width:56px;height:3px;background:#63c23e;margin:18px 0;}
.cover-meta{display:flex;align-items:center;gap:22px;}
.cover-count{font-size:36px;font-weight:900;color:#fff;line-height:1;}
.cover-count-lbl{font-size:10px;font-weight:300;letter-spacing:3px;color:rgba(255,255,255,.4);text-transform:uppercase;margin-top:4px;}
.cover-vdiv{width:1px;height:36px;background:rgba(255,255,255,.15);}
.cover-year{font-size:10px;font-weight:200;letter-spacing:6px;color:rgba(255,255,255,.18);text-transform:uppercase;margin-top:28px;}

/* ════════════════════════
   PAGE LETTRE (paysage)
════════════════════════ */
.letter-pg{background:#0c0c0c;display:flex;align-items:center;justify-content:center;flex-direction:column;}
.letter-bg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;opacity:.08;}
.letter-big{position:relative;font-size:520px;font-weight:900;color:rgba(255,255,255,.04);line-height:1;letter-spacing:-20px;user-select:none;}
.letter-sub{position:relative;font-size:14px;font-weight:300;letter-spacing:10px;color:rgba(255,255,255,.35);text-transform:uppercase;margin-top:-38px;}
.letter-cnt{position:relative;margin-top:24px;font-size:12px;font-weight:700;letter-spacing:4px;color:#63c23e;text-transform:uppercase;}
.letter-logo{position:absolute;bottom:38px;left:50%;transform:translateX(-50%);height:36px;width:auto;opacity:.18;}

/* ════════════════════════════════════════════
   PAGE DOUBLE (2 collections) — PAYSAGE
   [INFO1] [RENDER1] | [RENDER2] [INFO2]
════════════════════════════════════════════ */
.double-pg{display:flex;flex-direction:row;width:100%;height:100%;}

/* Panneau info */
.dp-info{
  flex:0 0 22%;
  height:100%;
  background:#0e0e0e;
  display:flex;
  flex-direction:column;
  padding:32px 26px 26px 28px;
  position:relative;
  overflow:hidden;
}

/* Barre verte séparatrice */
.dp-bar-right{
  position:absolute;top:0;right:0;width:2px;height:100%;
  background:linear-gradient(to bottom,rgba(99,194,62,0) 5%,#63c23e 30%,#63c23e 70%,rgba(99,194,62,0) 95%);
  opacity:.5;
}
.dp-bar-left{
  position:absolute;top:0;left:0;width:2px;height:100%;
  background:linear-gradient(to bottom,rgba(99,194,62,0) 5%,#63c23e 30%,#63c23e 70%,rgba(99,194,62,0) 95%);
  opacity:.5;
}

/* Info RIGHT — texte aligné à droite */
.dp-info.right{align-items:flex-end;text-align:right;padding:32px 28px 26px 26px;}

/* Render */
.dp-render{flex:0 0 28%;height:100%;position:relative;overflow:hidden;}

/* Séparateur central */
.dp-center-sep{flex:0 0 2px;height:100%;background:rgba(0,0,0,.9);position:relative;z-index:2;}

.dp-render-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}

/* fades supprimés — causaient du rose en PDF */

/* ── Contenu panneaux info ── */
.dp-header{display:flex;justify-content:flex-end;align-items:flex-start;width:100%;margin-bottom:20px;}
.dp-info.right .dp-header{justify-content:flex-start;}
.dp-num{font-size:11px;font-weight:300;letter-spacing:3px;color:rgba(255,255,255,.28);}

.dp-cat{font-size:10px;font-weight:700;letter-spacing:4px;color:#63c23e;text-transform:uppercase;margin-bottom:8px;}
.dp-name{font-size:28px;font-weight:900;color:#fff;text-transform:uppercase;letter-spacing:.5px;line-height:.95;margin-bottom:10px;}
.dp-bar{width:32px;height:3px;background:#63c23e;margin-bottom:18px;}
.dp-info.right .dp-bar{margin-left:auto;}

.dp-lbl{font-size:9px;font-weight:700;letter-spacing:4px;color:rgba(255,255,255,.3);text-transform:uppercase;margin-bottom:10px;}

.dp-swatches{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;width:100%;}
.dp-info.right .dp-swatches{justify-content:flex-end;}
.dp-swatch{flex:0 0 calc(50% - 4px);position:relative;}
.dp-sw-img{width:100%;aspect-ratio:3/2;object-fit:cover;display:block;}
.dp-sw-name{font-size:9px;font-weight:400;letter-spacing:1.5px;color:rgba(255,255,255,.55);text-transform:uppercase;padding-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}

.dp-divider{width:100%;height:1px;background:rgba(255,255,255,.08);margin:12px 0;}

.dp-formats{display:flex;flex-wrap:wrap;gap:6px;margin-bottom:12px;}
.dp-info.right .dp-formats{justify-content:flex-end;}
.dp-fmt{font-size:11px;font-weight:700;color:rgba(255,255,255,.8);letter-spacing:.5px;
  padding:5px 10px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);white-space:nowrap;}

.dp-spacer{flex:1;}

.dp-footer{width:100%;display:flex;justify-content:space-between;align-items:flex-end;}
.dp-info.right .dp-footer{flex-direction:row-reverse;}
.dp-foot-txt{font-size:10px;font-weight:300;letter-spacing:2px;color:rgba(255,255,255,.2);text-transform:uppercase;line-height:1.8;}
.dp-dot{width:8px;height:8px;border-radius:50%;background:#63c23e;opacity:.4;flex-shrink:0;}

/* ════════════════════════════════════════
   PAGE SIMPLE (1 collection) — PAYSAGE
════════════════════════════════════════ */
.single-pg{display:flex;flex-direction:row;width:100%;height:100%;}
.sp-render{flex:0 0 60%;height:100%;position:relative;overflow:hidden;}
.sp-render-img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;}
/* sp-render-fade supprimé */
.sp-info{flex:0 0 40%;height:100%;background:#0e0e0e;display:flex;flex-direction:column;padding:36px 36px 28px 40px;position:relative;}
.sp-bar-line{position:absolute;top:0;left:0;width:2px;height:100%;
  background:linear-gradient(to bottom,rgba(99,194,62,0) 5%,#63c23e 30%,#63c23e 70%,rgba(99,194,62,0) 95%);opacity:.5;}

.sp-header{display:flex;justify-content:flex-end;align-items:flex-start;margin-bottom:28px;}
.sp-num{font-size:12px;font-weight:300;letter-spacing:3px;color:rgba(255,255,255,.28);}
.sp-cat{font-size:11px;font-weight:700;letter-spacing:4px;color:#63c23e;text-transform:uppercase;margin-bottom:10px;}
.sp-name{font-size:38px;font-weight:900;color:#fff;text-transform:uppercase;letter-spacing:.5px;line-height:.93;margin-bottom:12px;}
.sp-bar{width:40px;height:3px;background:#63c23e;margin-bottom:24px;}
.sp-lbl{font-size:10px;font-weight:700;letter-spacing:4px;color:rgba(255,255,255,.3);text-transform:uppercase;margin-bottom:12px;}
.sp-swatches{display:flex;flex-wrap:wrap;gap:10px;margin-bottom:22px;}
.sp-swatch{flex:0 0 calc(33.33% - 8px);}
.sp-sw-img{width:100%;aspect-ratio:1;object-fit:cover;display:block;}
.sp-sw-name{font-size:9px;font-weight:400;letter-spacing:1.5px;color:rgba(255,255,255,.5);text-transform:uppercase;padding-top:5px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.sp-divider{width:100%;height:1px;background:rgba(255,255,255,.08);margin:14px 0;}
.sp-formats{display:flex;flex-wrap:wrap;gap:8px;margin-bottom:18px;}
.sp-fmt{font-size:13px;font-weight:700;color:rgba(255,255,255,.85);letter-spacing:.5px;
  padding:6px 14px;border:1px solid rgba(255,255,255,.18);background:rgba(255,255,255,.05);}
.sp-spacer{flex:1;}
.sp-footer{display:flex;justify-content:space-between;align-items:flex-end;}
.sp-foot-txt{font-size:11px;font-weight:300;letter-spacing:2px;color:rgba(255,255,255,.2);text-transform:uppercase;line-height:1.8;}
.sp-green-dot{width:8px;height:8px;border-radius:50%;background:#63c23e;opacity:.4;}

/* ════════════════════
   PRINT
════════════════════ */
@media print{
  body{background:none}
  .pg-p,.pg-l{margin:0;page-break-after:always;break-after:page;}
}
@media screen{
  body{padding:12px 0}
  .pg-p,.pg-l{box-shadow:0 4px 40px rgba(0,0,0,.7);margin-bottom:6px;}
}
</style>

/* ── helpers ── */
const toName = s => s.split('-').map(w=>w[0].toUpperCase()+w.slice(1)).join(' ');
const src = (slug,type,file) =>
  'docs/'+slug+'/'+(type==='R'?'RENDER':'TEXTURE')+'/'+encodeURIComponent(file);
const mk = (tag,cls,html) => {
  const e=document.createElement(tag);
  if(cls) e.className=cls;
  if(html!==undefined) e.innerHTML=html;
  return e;
};
const img = (s,cls,lazy) => {
  const i=document.createElement('img');
  i.src=s;if(cls)i.className=cls;
  i.loading=lazy===false?'eager':'lazy';
  return i;
};

/* ════════════════════════
   COUVERTURE (paysage)
════════════════════════ */
function cover(){
  const d=mk('div','pg-p cover');

  /* Panneau gauche titre */
  const left=mk('div','cover-left');
  left.appendChild(mk('div','cover-bar'));
  const lo=img('logo-dekor.png','cover-logo',false); lo.alt='Dekor & Design'; left.appendChild(lo);
  left.appendChild(mk('div','cover-spacer'));
  left.appendChild(mk('div','cover-eyebrow','Showroom · Revêtement · Céramique'));
  left.appendChild(mk('div','cover-title','Catalogue<br><span class="light">Carrelages</span>'));
  left.appendChild(mk('div','cover-rule'));
  left.appendChild(mk('div','cover-meta',
    '<div><div class="cover-count">'+DB.length+'<span style="font-size:24px;font-weight:200">+</span></div>'+
    '<div class="cover-count-lbl">Références</div></div>'+
    '<div class="cover-vdiv"></div>'+
    '<div><div class="cover-count">15<span style="font-size:24px;font-weight:200">+</span></div>'+
    '<div class="cover-count-lbl">Formats</div></div>'+
    '<div class="cover-vdiv"></div>'+
    '<div><div class="cover-count">2025</div><div class="cover-count-lbl">Collection</div></div>'
  ));
  left.appendChild(mk('div','cover-year','Catalogue · 2025 · Carrelages'));
  d.appendChild(left);

  /* Render droite */
  const right=mk('div','cover-right');
  right.appendChild(img(src('concept','R','Concept 120x180 Render 1.jpg'),'cover-bg',false));
  d.appendChild(right);

  return d;
}

/* ════════════════
   PAGE LETTRE
════════════════ */
function letterPage(letter, count, bgSlug, bgType, bgFile){
  const d=mk('div','pg-l letter-pg');
  if(bgSlug) d.appendChild(img(src(bgSlug,bgType,bgFile),'letter-bg'));
  d.appendChild(mk('div','letter-big',letter));
  d.appendChild(mk('div','letter-sub','Collections'));
  d.appendChild(mk('div','letter-cnt',count+' référence'+(count>1?'s':'')));
  const ll=img('logo-dekor.png','letter-logo'); ll.alt='D&D'; d.appendChild(ll);
  return d;
}

/* ════════════════════════════════════
   BUILDER panneau info (gauche ou droite)
════════════════════════════════════ */
let pageNum=2;

function infoPanel(slug, type, file, fmt, formats, swatches, side){
  const d=mk('div', 'dp-info'+(side==='right'?' right':''));

  // Barre verte
  d.appendChild(mk('div', side==='right'?'dp-bar-left':'dp-bar-right'));

  // Header: numéro seulement (plus de logo)
  const hdr=mk('div','dp-header');
  hdr.appendChild(mk('div','dp-num',String(pageNum++).padStart(3,'0')));
  d.appendChild(hdr);

  // Nom
  d.appendChild(mk('div','dp-cat','Carrelage · Collection'));
  d.appendChild(mk('div','dp-name',toName(slug)));
  d.appendChild(mk('div','dp-bar'));

  // Swatches couleurs
  const hasSwatch = swatches && swatches.length>0;
  d.appendChild(mk('div','dp-lbl','Coloris'));
  const swGrid=mk('div','dp-swatches');
  if(hasSwatch){
    swatches.slice(0,6).forEach(s=>{
      const box=mk('div','dp-swatch');
      const si=img(src(slug,'T',s.file),'dp-sw-img');
      si.onerror=function(){this.style.background='#252525'};
      box.appendChild(si);
      box.appendChild(mk('div','dp-sw-name',s.color));
      swGrid.appendChild(box);
    });
  } else {
    // fallback swatch = render
    const box=mk('div','dp-swatch');
    const si=img(src(slug,type,file),'dp-sw-img');
    si.onerror=function(){this.style.background='#252525'};
    box.appendChild(si);
    box.appendChild(mk('div','dp-sw-name','Référence'));
    swGrid.appendChild(box);
  }
  d.appendChild(swGrid);

  // Divider
  d.appendChild(mk('div','dp-divider'));

  // Formats
  d.appendChild(mk('div','dp-lbl','Formats (cm)'));
  const fmtRow=mk('div','dp-formats');
  (formats && formats.length>0?formats:[fmt]).forEach(f=>fmtRow.appendChild(mk('span','dp-fmt',f)));
  d.appendChild(fmtRow);

  // Spacer
  d.appendChild(mk('div','dp-spacer'));

  // Footer : brand text uniquement côté droit
  const foot=mk('div','dp-footer');
  if(side==='right'){
    foot.appendChild(mk('div','dp-foot-txt','Dekor &amp; Design<br>Showroom · 2025'));
  }
  foot.appendChild(mk('div','dp-dot'));
  d.appendChild(foot);

  return d;
}

/* ════════════════════════════════════
   PAGE DOUBLE (2 collections)
   [INFO LEFT] [RENDER 1] | [RENDER 2] [INFO RIGHT]
════════════════════════════════════ */
function doublePage(p1, p2){
  const d=mk('div','pg-l');
  const inner=mk('div','double-pg');

  // Panneau gauche (collection 1)
  inner.appendChild(infoPanel(p1[0],p1[1],p1[2],p1[3],p1[4],p1[5],'left'));

  // Render 1 (gauche)
  const r1=mk('div','dp-render');
  const ri1=img(src(p1[0],p1[1],p1[2]),'dp-render-img');
  ri1.onerror=function(){this.parentElement.style.background='#161616'};
  r1.appendChild(ri1);
  inner.appendChild(r1);

  // Séparateur central
  inner.appendChild(mk('div','dp-center-sep'));

  // Render 2 (droite)
  const r2=mk('div','dp-render');
  const ri2=img(src(p2[0],p2[1],p2[2]),'dp-render-img');
  ri2.onerror=function(){this.parentElement.style.background='#161616'};
  r2.appendChild(ri2);
  inner.appendChild(r2);

  // Panneau droit (collection 2)
  inner.appendChild(infoPanel(p2[0],p2[1],p2[2],p2[3],p2[4],p2[5],'right'));

  d.appendChild(inner);
  return d;
}

/* ════════════════════════════════════
   PAGE SIMPLE (1 collection)
════════════════════════════════════ */
function singlePage(p){
  const d=mk('div','pg-l');
  const inner=mk('div','single-pg');

  // Render
  const r=mk('div','sp-render');
  const ri=img(src(p[0],p[1],p[2]),'sp-render-img');
  ri.onerror=function(){this.parentElement.style.background='#161616'};
  r.appendChild(ri);
  inner.appendChild(r);

  // Info
  const info=mk('div','sp-info');
  info.appendChild(mk('div','sp-bar'));

  const hdr=mk('div','sp-header');
  hdr.appendChild(mk('div','sp-num',String(pageNum++).padStart(3,'0')));
  info.appendChild(hdr);

  info.appendChild(mk('div','sp-cat','Carrelage · Collection'));
  info.appendChild(mk('div','sp-name',toName(p[0])));
  info.appendChild(mk('div','sp-bar'));

  info.appendChild(mk('div','sp-lbl','Coloris disponibles'));
  const swG=mk('div','sp-swatches');
  const swatches=p[5]||[];
  if(swatches.length>0){
    swatches.slice(0,6).forEach(s=>{
      const box=mk('div','sp-swatch');
      const si=img(src(p[0],'T',s.file),'sp-sw-img');
      si.onerror=function(){this.style.background='#252525'};
      box.appendChild(si);
      box.appendChild(mk('div','sp-sw-name',s.color));
      swG.appendChild(box);
    });
  } else {
    const box=mk('div','sp-swatch');
    const si=img(src(p[0],p[1],p[2]),'sp-sw-img');
    si.onerror=function(){this.style.background='#252525'};
    box.appendChild(si);
    box.appendChild(mk('div','sp-sw-name','Référence'));
    swG.appendChild(box);
  }
  info.appendChild(swG);
  info.appendChild(mk('div','sp-divider'));
  info.appendChild(mk('div','sp-lbl','Formats disponibles (cm)'));
  const fmtRow=mk('div','sp-formats');
  (p[4]&&p[4].length>0?p[4]:[p[3]]).forEach(f=>fmtRow.appendChild(mk('span','sp-fmt',f)));
  info.appendChild(fmtRow);
  info.appendChild(mk('div','sp-spacer'));
  const foot=mk('div','sp-footer');
  foot.appendChild(mk('div','sp-foot-txt','Dekor &amp; Design<br>Showroom · 2025'));
  foot.appendChild(mk('div','sp-green-dot'));
  info.appendChild(foot);

  inner.appendChild(info);
  d.appendChild(inner);
  return d;
}

};

/* Grouper par lettre */
const groups={};
DB.forEach(r=>{
  const L=toName(r[0])[0].toUpperCase();
  (groups[L]=groups[L]||[]).push(r);
});

Object.keys(groups).sort().forEach(L=>{
  const items=groups[L];
  const hero=heroByLetter[L];

  /* Page transition lettre */
  root.appendChild(letterPage(L,items.length,
    hero?hero[0]:null,hero?hero[1]:null,hero?hero[2]:null));

  /* Pages produits : 2 par page */
  for(let i=0;i<items.length;i+=2){
    if(i+1<items.length){
      root.appendChild(doublePage(items[i],items[i+1]));
    } else {
      root.appendChild(singlePage(items[i]));
    }
  }
});
