<!DOCTYPE html>
<html>
<head>
<style>
  body { margin: 40px; background: #111; font-family: sans-serif; }
  .grid { display: flex; gap: 2px; }
  .card { width: 220px; position: relative; overflow: hidden; cursor: pointer; }
  img { width: 100%; height: 300px; object-fit: cover; display: block; filter: brightness(0.7); }
  .label { position: absolute; bottom: 12px; left: 10px; right: 10px; color: #fff; font-size: 11px; letter-spacing: 2px; text-transform: uppercase; text-shadow: 0 2px 6px rgba(0,0,0,0.9); }
  .num { position: absolute; top: 10px; left: 10px; color: #d4af37; font-size: 13px; font-weight: bold; }
</style>
</head>
<body>
  <div class="grid">
    <div class="card">
      <span class="num">1</span>
      <img src="https://www.geniuspergola.com/img/_19385122112019_.jpg" />
      <div class="label">Guillotine Verre</div>
    </div>
    <div class="card">
      <span class="num">2</span>
      <img src="https://www.geniuspergola.com/img/_19365022112019_.jpg" />
      <div class="label">Store ZIP</div>
    </div>
    <div class="card">
      <span class="num">3</span>
      <img src="https://static.wixstatic.com/media/79d85a_a8ad22d17e644497bc7985fa594cae07~mv2.png/v1/fill/w_900,h_600,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/door.png" />
      <div class="label">Woodline (bois/alu)</div>
    </div>
    <div class="card">
      <span class="num">4</span>
      <img src="https://static.wixstatic.com/media/79d85a_34d7018d4e2842699bb2a27eb367f8af~mv2.png/v1/fill/w_900,h_600,al_c,q_85,usm_0.66_1.00_0.01,enc_avif,quality_auto/door.png" />
      <div class="label">Stoneline (effet pierre)</div>
    </div>
  </div>
</body>
</html>
